databases:
  - name: judge-graph-db
    plan: free

services:
  - type: web
    name: judge-graph-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node db/migrate.js && node db/seed.js && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: judge-graph-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://judge-graph-frontend.onrender.com

  - type: web
    name: judge-graph-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://judge-graph-backend.onrender.com
